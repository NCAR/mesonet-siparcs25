apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.credit.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.credit.name }}
    group: {{ .Values.app.group }}
spec:
  revisionHistoryLimit: 3
  replicas: {{ .Values.credit.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.credit.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.credit.name }}
    spec:
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
      initContainers:
      - name: copy-static-files
        image: busybox:1.35
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        command: ['sh', '-c']
        args:
        - |
          echo "Running as user: $(id)"
          echo "Checking source permissions..."
          ls -la /campaign/
          echo "Checking destination permissions..."
          ls -la /static-data/
          echo "Copying NetCDF files to static volume..."
          for file in /campaign/*.nc; do
            if [ -r "$file" ]; then
              echo "Copying $(basename "$file")..."
              cp "$file" /static-data/ || echo "Failed to copy $(basename "$file")"
            else
              echo "Cannot read $file"
            fi
          done
          echo "Copy operation completed"
          ls -la /static-data/
        volumeMounts:
        - name: campaign
          mountPath: /campaign
        - name: static-volume
          mountPath: /static-data
      - name: copy-checkpoint
        image: busybox:1.35
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        command: ['sh', '-c']
        args:
        - |
          echo "Running as user: $(id)"
          echo "Checking source permissions..."
          ls -la /campaign/
          echo "Checking destination permissions..."
          ls -la /checkpoint/
          echo "Copying model checkpoint to checkpoint volume..."
          if [ -r "/campaign/model_checkpoint.pt" ]; then
            echo "Copying model_checkpoint.pt..."
            cp /campaign/model_checkpoint.pt /checkpoint/ || echo "Failed to copy model_checkpoint.pt"
          else
            echo "Cannot read /campaign/model_checkpoint.pt"
          fi
          echo "Copy operation completed"
          ls -la /checkpoint/
        volumeMounts:
        - name: campaign
          mountPath: /campaign
        - name: checkpoint-volume
          mountPath: /checkpoint
      containers:
      - name: {{ .Values.credit.name }}
        image: {{ .Values.credit.container.image }}
        imagePullPolicy: {{ .Values.app.imagePullPolicy }}
        resources:
          limits:
            memory: {{ .Values.credit.container.memory }}
            cpu: {{ .Values.credit.container.cpu }}
        volumeMounts:
        - name: config-volume
          mountPath: /cloud/config.yaml
          subPath: config.yaml
        - name: logger-volume
          mountPath: /cloud/services/credit/logger.py
          subPath: logger.py
        - name: static-volume
          mountPath: /cloud/services/credit/static_data
        - name: checkpoint-volume
          mountPath: /cloud/services/credit/credit_run/results
        - name: campaign
          mountPath: /glade/campaign/work/agbeli/mesonet
      volumes:
      - name: campaign
        nfs:
          server: gladedm1.ucar.edu
          path: /gpfs/csfs1/work/agbeli/mesonet
          readOnly: true
      - name: config-volume
        configMap:
          name: {{ .Values.app.config.name }}
      - name: logger-volume
        configMap:
          name: {{ .Values.app.logger.name }}
      - name: static-volume
        persistentVolumeClaim:
          claimName: {{ .Values.credit.volume.static_data.name }}
      - name: checkpoint-volume
        persistentVolumeClaim:
          claimName: {{ .Values.credit.volume.checkpoint.name }}
