apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.credit.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.credit.name }}
    group: {{ .Values.app.group }}
spec:
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  replicas: {{ .Values.credit.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.credit.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.credit.name }}
    spec:
      runtimeClassName: nvidia
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: copy-static-files
        image: busybox:1.35
        command: ['sh', '-c']
        args:
        - |
          echo "Running as user: $(id)"
          chown -R root:root /static-data
          echo "Attempting to create test file..."
          touch /static-data/test.txt 2>/dev/null && echo "Write test successful" || echo "Write test failed"
          echo "Copying NetCDF files to static volume..."
          cp /campaign/*.nc /static-data/
          echo "NetCDF files copied successfully"
          ls -la /
          ls -la /static-data/
        volumeMounts:
        - name: campaign
          mountPath: /campaign
        - name: static-volume
          mountPath: /static-data
      - name: copy-checkpoint
        image: busybox:1.35
        command: ['sh', '-c']
        args:
        - |
          echo "Running as user: $(id)"
          chown -R root:root /checkpoint
          echo "Attempting to create test file..."
          touch /checkpoint/test.txt 2>/dev/null && echo "Write test successful" || echo "Write test failed"
          echo "Copying model checkpoint to checkpoint volume..."
          cp /campaign/model_checkpoint.pt /checkpoint/
          echo "Model checkpoint copied successfully"
          ls -la /
          ls -la /checkpoint/
        volumeMounts:
        - name: campaign
          mountPath: /campaign
        - name: checkpoint-volume
          mountPath: /checkpoint
      containers:
      - name: {{ .Values.credit.name }}
        image: {{ .Values.credit.container.image }}
        imagePullPolicy: {{ .Values.app.imagePullPolicy }}
        resources:
          limits:
            memory: {{ .Values.credit.container.memory }}
            cpu: {{ .Values.credit.container.cpu }}
            nvidia.com/gpu: "1"
          requests:
            nvidia.com/gpu: "1"
        env:
        - name: FORECAST_DATE
          value: {{ tpl .Values.credit.environment.forecast_date . | quote }}
        - name: FORECAST_DAYS
          value: {{ .Values.credit.environment.forecast_days }}
        volumeMounts:
        - name: config-volume
          mountPath: /cloud/config.yaml
          subPath: config.yaml
        - name: logger-volume
          mountPath: /cloud/services/credit/logger.py
          subPath: logger.py
        - name: static-volume
          mountPath: /cloud/services/credit/static_data
        - name: checkpoint-volume
          mountPath: /cloud/services/credit/credit_run/results
        - name: campaign
          mountPath: /glade/campaign/work/agbeli/mesonet
      volumes:
      - name: campaign
        nfs:
          server: gladedm1.ucar.edu
          path: /gpfs/csfs1/work/agbeli/mesonet
          readOnly: true
      - name: config-volume
        configMap:
          name: {{ .Values.app.config.name }}
      - name: logger-volume
        configMap:
          name: {{ .Values.app.logger.name }}
      - name: static-volume
        persistentVolumeClaim:
          claimName: {{ .Values.credit.volume.static_data.name }}
      - name: checkpoint-volume
        persistentVolumeClaim:
          claimName: {{ .Values.credit.volume.checkpoint.name }}