apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.mapserver.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    group: {{ .Values.app.group }}
  annotations:
    cert-manager.io/cluster-issuer: "incommon"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "{{ .Values.mapserver.name }}"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx-external
  tls:
    - hosts:
      - {{ .Values.mapserver.tls.fqdn }}
      secretName: {{ .Values.mapserver.tls.secretName }}
  rules:
  - host: {{ .Values.mapserver.tls.fqdn }}
    http:
      paths:
      - path: {{ .Values.mapserver.path }}
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.mapserver.name }}
            port:
              number: {{ .Values.mapserver.container.port }}