apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.mqttlegacy.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.mqttlegacy.name }}
    group: {{ .Values.app.group }}
spec:
  revisionHistoryLimit: 3
  replicas: {{ .Values.mqttlegacy.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.mqttlegacy.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.mqttlegacy.name }}
    spec:
      containers:
      - name: {{ .Values.mqttlegacy.name }}
        image: {{ .Values.mqttlegacy.container.image }}
        imagePullPolicy: {{ .Values.app.imagePullPolicy }}
        resources:
          limits:
            memory: {{ .Values.mqttlegacy.container.memory }}
            cpu: {{ .Values.mqttlegacy.container.cpu }}
        env:
        - name: MB_ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.app.group }}-esos
              key: MB_ADMIN_EMAIL
        - name: MB_ADMIN_PASS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.app.group }}-esos
              key: MB_ADMIN_PASS
        - name: MB_DB_TYPE
          value: postgres
        - name: MB_DB_DBNAME
          value: metabase
        - name: MB_DB_PORT
          value: "5432"
        - name: MB_DB_USER
          value: postgres
        - name: MB_DB_PASS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.app.group }}-esos
              key: MB_DB_PASS
        - name: MB_DB_HOST
          value: postgres
        - name: ORCH_DB_USER
          value: postgres
        - name: ORCH_DB_PASS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.app.group }}-esos
              key: ORCH_DB_PASS
        - name: ORCH_DB_NAME
          value: iotwx_db
        - name: ORCH_DB_HOST
          value: postgres
        volumeMounts:
        - name: config-volume
          mountPath: /cloud/config.yaml
          subPath: config.yaml
        - name: logger-volume
          mountPath: /cloud/services/mqtt_legacy/logger.py
          subPath: logger.py
      volumes:
      - name: config-volume
        configMap:
          name: {{ .Values.app.config.name }}
      - name: logger-volume
        configMap:
            name: {{ .Values.app.logger.name }}