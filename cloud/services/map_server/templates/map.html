<!DOCTYPE html>
<html lang="en">
<head>
  <title>Real-Time Sensor Network Map</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    body { margin: 0; padding: 0; }
    #map { height: 100vh; width: 100vw; }

    .station-marker {
      background: #3388ff;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
      border: 2px solid white;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .station-popup {
      min-width: 250px;
      max-width: 350px;
      font-size: 14px;
      overflow-y: auto;
      max-height: 70vh;
    }

    .station-popup h3 {
      margin: 0 0 10px 0;
      padding-bottom: 5px;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      background: white;
      z-index: 10;
    }

    .station-popup table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 10px;
    }

    .station-popup td {
      padding: 3px 5px;
      border-bottom: 1px solid #eee;
    }

    .station-popup td:first-child {
      font-weight: bold;
      width: 40%;
    }

    .timestamp {
      font-size: 0.8em;
      color: #777;
      text-align: right;
      margin-top: 5px;
      position: sticky;
      bottom: 0;
      background: white;
      padding-top: 5px;
      border-top: 1px solid #eee;
    }

    .popup-controls {
      position: absolute;
      top: 5px;
      right: 5px;
      z-index: 20;
      display: flex;
      gap: 3px;

    .popup-controls button {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 3px;
      padding: 2px 5px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.1s ease-out;

    .popup-controls button:hover {
      background: #f0f0f0;

    .close-popup { color: #ff4444; }

      position: fixed;

      background: #ff4444;
      color: white;
      padding: 10px;
      border-radius: 5px;
      display: none;
      z-index: 1001;
      max-width: 80%;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    #error-message button {
      background: transparent;
      border: none;
      color: white;
      font-size: 14px;
      cursor: pointer;
      margin-left: 10px;
    }

    #loading-message {
      position: fixed;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 10px;
      border-radius: 5px;
      display: none;
      z-index: 1000;
      max-width: 80%;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    #loading-message::before {
      content: '';
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s linear infinite;
      margin-right: 5px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .collapsible {
      cursor: pointer;
      padding: 5px;
      background: #f5f5f5;

      margin: 5px 0;
      border-radius: 3px;
      display: flex;
      justify-content: space-between;

    }

      display: block;
    }
  </style>
</head>
<body>
  <div id="map" aria-label="Interactive sensor network map"></div>
  <div id="error-message" role="alert"><span></span><button aria-label="Dismiss error">×</button></div>
  <div id="loading-message">Loading...</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js" integrity="sha512-8BHxHDLsOHx+flIrQ0DrZcea7MkHqRU5GbTHmbdzMRnAaoCIkZ97PqZcXJkKZckMMhqfoeaJE+DNUVuyoQsO3Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    const DEFAULT_LATITUDE = 39.9784;
    const DEFAULT_LONGITUDE = -105.2749;
    const locale = navigator.language || 'en-US';

    // Load map state from localStorage
    const savedState = JSON.parse(localStorage.getItem('mapState') || '{}');
    const initialView = {
      lat: savedState.lat || DEFAULT_LATITUDE,
      lng: savedState.lng || DEFAULT_LONGITUDE,
      zoom: savedState.zoom || 13
    };

    // Initialize map
    const map = L.map('map').setView([initialView.lat, initialView.lng], initialView.zoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Save map state on moveend
    map.on('moveend', () => {
      const center = map.getCenter();
      localStorage.setItem('mapState', JSON.stringify({
        lat: center.lat,
        lng: center.lng,
        zoom: map.getZoom()
      }));
    });

    // Initialize Socket.IO
    const socket = io({
      path: '/socket.io',
      transports: ['polling', 'websocket'], // Enable fallback
      reconnection: true,
      reconnectionAttempts: 5,
      reconnectionDelay: 1000,
      reconnectionDelayMax: 5000,
      timeout: 60000, // Match server ping_timeout
      pingInterval: 25000 // Match server ping_interval
    });

    socket.on('connect', () => {
      console.log('Connected to SocketIO server:', socket.id);
      showLoading(true);
    });

    socket.on('connect_error', (error) => {
      console.error('SocketIO Connect Error:', error.message);
      handleError(`Connection error: ${error.message}`, error);
    });

    socket.on('reconnect_attempt', (attempt) => {
      console.log(`Reconnection attempt ${attempt}`);
      showLoading(true);
    });

    socket.on('reconnect', () => {
      console.log('Reconnected to SocketIO server');
      showLoading(false);
    });

    const stations = {};
    const markerMap = {};
    const activePopups = new Set();
    let expandedSectionsState = JSON.parse(localStorage.getItem('expandedSectionsState') || '{}');

    const markers = L.markerClusterGroup({
      maxClusterRadius: 40,
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: true,
      zoomToBoundsOnClick: true,
      iconCreateFunction: function(cluster) {
        const count = cluster.getChildCount();
        const size = Math.min(40 + Math.log(count) * 10, 60);
        return L.divIcon({
          html: `<div>${count}</div>`,
          className: 'marker-cluster marker-cluster-small',
          iconSize: L.point(size, size)
        });
      }
    });
    map.addLayer(markers);

    const errorMessage = document.getElementById('error-message');
    const errorText = errorMessage.querySelector('span');
    const errorDismiss = errorMessage.querySelector('button');
    const loadingMessage = document.getElementById('loading-message');

    function handleError(message, error) {
      console.error(`[error] ${message}`, error);
      errorText.textContent = message;
      errorMessage.style.display = 'block';
      errorDismiss.focus();
    }

    errorDismiss.addEventListener('click', () => {
      errorMessage.style.display = 'none';
    });

    function showLoading(show) {
      loadingMessage.style.display = show ? 'block' : 'none';
    }

    function escapeHTML(str) {
      if (str == null) return 'N/A';
      const div = document.createElement('div');
      div.textContent = str.toString();
      return div.innerHTML;
    }

    function createMarkerIcon(stationId, stationData) {
      let metadata = {};
      try {
        metadata = JSON.parse(stationData.metadata || '{}');
      } catch (e) {
        console.error(`[error] parsing metadata for ${stationId}`, e);
      }
      const isActive = metadata.active !== false;
      return L.divIcon({
        className: 'station-marker',
        html: `<div style="background: ${isActive ? '#228B22' : '#ff0000'};" >${escapeHTML(stationId)}</div>`,
        iconSize: [24, 24],
        iconAnchor: [12, 12],
        popupAnchor: [0, -12]
      });
    }

    function createPopupContent(stationId, stationData) {
      let html = `
        <div class="station-popup" role="dialog" aria-label="Station ${escapeHTML(stationId)} details">
          <div class="popup-controls">
            <button class="close-popup" title="Close" aria-label="Close popup">×</button>
          </div>
          <h3>Station ${escapeHTML(stationId)}</h3>
      `;

      let sensorData = {}, modelSummaries = {}, metadata = {};
      try {
        sensorData = (JSON.parse(stationData.data || '{}').data || {});
        modelSummaries = JSON.parse(stationData.model_summaries || '{}');
        metadata = JSON.parse(stationData.metadata || '{}');
      } catch (e) {
        console.error(`[error] parsing data for ${stationId}`, e);
        html += `<p>Error parsing station data</p></div>`;
        return html;
      }

      const mdOpen = expandedSectionsState[stationId]?.metadata || false;
      html += `<div class="collapsible ${mdOpen ? 'active' : ''}" data-section="metadata">Metadata</div>
               <div class="content ${mdOpen ? 'active' : ''}">
               <table>`;

      for (const [k, v] of Object.entries(metadata)) {
        html += `<tr><td>${escapeHTML(k)}</td><td>${escapeHTML(v)}</td></tr>`;
      }
      html += `</table>`;

      if (stationData.last_active) {
        const ts = new Date(stationData.last_active);
        html += `<div class="timestamp">Last updated: ${
          isNaN(ts.getTime()) ? 'N/A' : escapeHTML(ts.toLocaleString(locale))
        }</div>`;
      }
      html += `</div>`;

      for (const [sensor, measurements] of Object.entries(sensorData)) {
        const open = expandedSectionsState[stationId]?.[sensor] || false;
        html += `<div class="collapsible ${open ? 'active' : ''}" data-section="${escapeHTML(sensor)}">${escapeHTML(sensor)}</div>
                 <div class="content ${open ? 'active' : ''}"><table>`;
        for (const [m, v] of Object.entries(measurements)) {
          html += `<tr><td>${escapeHTML(m)}</td><td>${escapeHTML(v)}</td></tr>`;
        }
        html += `</table></div>`;
      }

      const smOpen = expandedSectionsState[stationId]?.summaries || false;
      html += `<div class="collapsible ${smOpen ? 'active' : ''}" data-section="summaries">AI-Generated Insights</div>
               <div class="content ${smOpen ? 'active' : ''}">`;

      if (Object.keys(modelSummaries).length > 0) {
        html += `<table>`;
        for (const [k, v] of Object.entries(modelSummaries)) {
          const name = k.replace('summary_', '').replace('ai/', '');
          html += `<tr><td>${escapeHTML(name)}</td><td>${escapeHTML(v)}</td></tr>`;
        }
        html += `</table>`;
      } else {
        html += `<p>No model summaries available</p>`;
      }

      html += `</div></div>`;
      return html;
    }

    function debounce(fn, wait) {
      let t;
      return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), wait);
      };
    }

    function setupPopupControls(popup, marker) {
      const el = popup.getElement();
      const closeBtn = el.querySelector('.close-popup');
      const listeners = [];

      const onClose = e => {
        e.stopPropagation();
        popup.remove();
        activePopups.delete(marker);
        if (marker.cleanupPopup) {
          marker.cleanupPopup();
        }
      };
      closeBtn.addEventListener('click', onClose);
      listeners.push({ el: closeBtn, ev: 'click', fn: onClose });

      Array.from(el.querySelectorAll('.collapsible')).forEach(sec => {
        const onToggle = e => {
          e.stopPropagation();
          const name = sec.dataset.section;
          const isOpen = sec.classList.toggle('active');
          const content = sec.nextElementSibling;
          content.classList.toggle('active', isOpen);
          expandedSectionsState[marker.options.layerId] = {
            ...(expandedSectionsState[marker.options.layerId] || {}),
            [name]: isOpen
          };
          localStorage.setItem('expandedSectionsState', JSON.stringify(expandedSectionsState));
        };
        sec.addEventListener('click', onToggle);
        listeners.push({ el: sec, ev: 'click', fn: onToggle });
      });

      marker.cleanupPopup = () => {
        listeners.forEach(({ el, ev, fn }) => el.removeEventListener(ev, fn));
      };
    }

    function updateStationMarker(stationId, stationData) {
      if (!stationData?.latitude || !stationData?.longitude || isNaN(+stationData.latitude) || isNaN(+stationData.longitude)) {
        handleError(`Invalid coordinates for station ${stationId}`);
        return;
      }

      const prevData = stations[stationId];
      stations[stationId] = stationData;
      const ll = [+stationData.latitude, +stationData.longitude];
      const existing = markerMap[stationId];

      if (existing) {
        // Skip update if data is unchanged
        if (JSON.stringify(prevData) === JSON.stringify(stationData)) {
          return;
        }

        const wasOpen = activePopups.has(existing);
        existing.options.data = stationData;

        const newLatLng = L.latLng(ll);
        if (!existing.getLatLng().equals(newLatLng)) {
          existing.setLatLng(newLatLng);
        }

        existing.setIcon(createMarkerIcon(stationId, stationData));

        if (wasOpen) {
          const html = createPopupContent(stationId, stationData);
          existing.cleanupPopup && existing.cleanupPopup();
          existing.bindPopup(html, {
            className: 'station-popup-container',
            maxWidth: 350,
            minWidth: 250,
            autoClose: true,
            closeOnClick: true,
            closeButton: true
          }).openPopup();
        }
        return;
      }

      const marker = L.marker(ll, {
        icon: createMarkerIcon(stationId, stationData),
        data: stationData,
        layerId: stationId
      });

      const content = createPopupContent(stationId, stationData);
      marker.bindPopup(content, {
        className: 'station-popup-container',
        maxWidth: 350,
        minWidth: 250,
        autoClose: true,
        closeOnClick: true,
        closeButton: true
      });

      const adjustView = debounce(() => {
        const el = marker.getPopup()?.getElement();
        if (!el) return;
        const pr = el.getBoundingClientRect();
        const mr = map.getContainer().getBoundingClientRect();
        const dx = Math.min(0, mr.right - pr.right - 10);
        const dy = Math.min(0, mr.bottom - pr.bottom - 10);
        if (dx || dy) map.panBy([dx, dy], { animate: true });
      }, 100);

      marker.on('popupopen', () => {
        setupPopupControls(marker.getPopup(), marker);
        activePopups.add(marker);
        adjustView();
      });

      marker.on('popupclose', () => {
        activePopups.delete(marker);
        if (marker.cleanupPopup) {
          marker.cleanupPopup();
        }
      });

      markers.addLayer(marker);
      markerMap[stationId] = marker;
    }

    function cleanupStaleMarkers() {
      const validIds = new Set(Object.keys(stations));
      Object.keys(markerMap).forEach(id => {
        if (!validIds.has(id)) {
          const marker = markerMap[id];
          marker.cleanupPopup && marker.cleanupPopup();
          marker.getPopup()?.remove();
          markers.removeLayer(marker);
          activePopups.delete(marker);
          delete markerMap[id];
          delete expandedSectionsState[id];
        }
      });
      localStorage.setItem('expandedSectionsState', JSON.stringify(expandedSectionsState));
    }

    socket.on('initial_data', (data) => {
      console.log('Received initial data:', data.stations);
      showLoading(true);
      try {
        const newStations = data.stations || {};
        Object.entries(newStations).forEach(([id, s]) => {
          updateStationMarker(id, s);
        });
        cleanupStaleMarkers();
      } catch (e) {
        handleError('Failed to process initial station data', e);
      } finally {
        showLoading(false);
      }
    });

    socket.on('station_update', (data) => {
      console.log('Received station update:', data.stations);
      try {
        const newStations = data.stations || {};
        Object.entries(newStations).forEach(([id, s]) => {
          updateStationMarker(id, s);
        });
        cleanupStaleMarkers();
      } catch (e) {
        handleError('Failed to process station update', e);
      }
    });

    socket.on('disconnect', (reason) => {
      console.error('WebSocket Disconnected:', reason);
      handleError(`Lost connection to server: ${reason}`, null);
    });
  </script>
</body>
</html>
